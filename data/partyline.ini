# Default Partyline server list. Copied into
# ~/.config/partyline/partyline.ini on first run if that file is missing.
# Nick is filled from the local username.

[user]
nick=
realname=
last_server=

[ui]
width=900
height=600
palette=1

[server.undernet]
name=Undernet
host=irc.undernet.org
port=6667
tls=false
tls_verify=true
nick=

[server.efnet]
name=EFNet
host=irc.efnet.nl
port=6697
tls=true
tls_verify=true
nick=

[server.oftc]
name=OFTC
host=irc.oftc.net
port=6697
tls=true
tls_verify=true
nick=

[server.rizon_uk]
name=Rizon UK
host=irc.rizon.net
port=6697
tls=true
tls_verify=true
nick=

[server.libera]
name=Libera
host=irc.libera.chat
port=6697
tls=true
tls_verify=true
nick=
